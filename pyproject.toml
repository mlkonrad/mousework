[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mousework"
version = "0.1.4"
description = "Settings for SteelSeries Rival 3 Wireless mice on Linux"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
mousework = "mousework.cli:main"
mousework-filter = "mousework.filterd:main"

[project.gui-scripts]
mousework-gtk = "mousework.gui:main"

[tool.setuptools]
packages = ["mousework"]
